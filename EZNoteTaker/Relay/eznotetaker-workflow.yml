# EZNoteTaker cloud relay — installed into your private relay repo by the EZNoteTaker app.
# When the iPhone uploads a lecture to jobs/<id>/, this runs Claude Code (Claude Opus 5.5) on YOUR
# Claude subscription and commits the study notes to results/<id>.json for the app to download.
#
# One-time setup: run `claude setup-token` on a computer with Claude Code, then add the token as the
# repository secret CLAUDE_CODE_OAUTH_TOKEN (Settings › Secrets and variables › Actions).
name: EZNoteTaker Claude relay

on:
  push:
    paths: ["jobs/**/READY"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eznotetaker-relay
  cancel-in-progress: false

jobs:
  study-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Turn lectures into study notes
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MODEL: claude-opus-5-5
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            # Leave the jobs queued; they are processed on the next run once the secret exists.
            echo "::error::Missing repository secret CLAUDE_CODE_OAUTH_TOKEN. Run 'claude setup-token' and add it under Settings > Secrets and variables > Actions, then re-run this workflow."
            exit 1
          fi
          # Tokens pasted on a phone often pick up line breaks or spaces.
          CLAUDE_CODE_OAUTH_TOKEN="$(printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d '[:space:]')"
          export CLAUDE_CODE_OAUTH_TOKEN
          case "$CLAUDE_CODE_OAUTH_TOKEN" in
            sk-ant-oat*) ;;
            *) echo "::error::CLAUDE_CODE_OAUTH_TOKEN doesn't look like a Claude token (it should start with sk-ant-oat). Copy the long token printed at the end of 'claude setup-token', not the sign-in code."; exit 1 ;;
          esac
          mkdir -p results
          for job in jobs/*/; do
            [ -d "$job" ] || continue
            id="$(basename "$job")"
            [ -f "$job/READY" ] || continue
            echo "Processing lecture $id"
            if (cd "$job" && claude -p "Read prompt.md in the current folder and follow its instructions exactly. Your final reply must be only the JSON object it asks for." \
                  --model "$MODEL" --allowedTools "Read" --output-format text) > "results/$id.json.partial" 2> claude-stderr.txt \
               && grep -q '"buildings"' "results/$id.json.partial"; then
              mv "results/$id.json.partial" "results/$id.json"
            else
              { echo "Claude Code failed in the cloud relay."; tail -c 1500 claude-stderr.txt; tail -c 500 "results/$id.json.partial"; } > "results/$id.error.txt"
              rm -f "results/$id.json.partial"
            fi
            git rm -rq --ignore-unmatch "$job"
            rm -rf "$job"
          done
          rm -f claude-stderr.txt

      - name: Commit results
        run: |
          git config user.name "eznotetaker-relay"
          git config user.email "eznotetaker-relay@users.noreply.github.com"
          git add -A .
          git commit -m "Study notes from Claude" || exit 0
          for attempt in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
