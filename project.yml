# Optional: regenerate the Xcode project with XcodeGen (`brew install xcodegen && xcodegen`).
# The checked-in EZNoteTaker.xcodeproj already works without this.
name: EZNoteTaker
options:
  bundleIdPrefix: com.heppiriraid
  deploymentTarget:
    iOS: "26.0"
targets:
  EZNoteTaker:
    type: application
    platform: iOS
    sources:
      - path: EZNoteTaker
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heppiriraid.EZNoteTaker
        INFOPLIST_FILE: EZNoteTaker/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: EZNoteTaker
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
